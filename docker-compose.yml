services:
  postgres:
    image: postgres:17-alpine
    container_name: zimmet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zimmet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zimmet_password}
      POSTGRES_DB: ${POSTGRES_DB:-zimmet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development mail catcher: every e-mail the API sends shows up at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: zimmet-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
